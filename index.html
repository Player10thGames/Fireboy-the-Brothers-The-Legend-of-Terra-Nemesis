<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Fireboy The Brothers - The Legend of Terra Nemesis (Demo)</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
<div id="game-container">
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <div id="touch-controls">
    <div id="dpad-container">
      <div id="dpad" class="touch-active">
        <button id="dpad-up" class="dpad-btn" data-dir="up">▲</button>
        <button id="dpad-left" class="dpad-btn" data-dir="left">◄</button>
        <button id="dpad-center" class="dpad-center"></button>
        <button id="dpad-right" class="dpad-btn" data-dir="right">►</button>
        <button id="dpad-down" class="dpad-btn" data-dir="down">▼</button>
      </div>
    </div>
    <div id="action-buttons">
      <button id="btn-a" class="action-btn btn-a">A</button>
      <button id="btn-b" class="action-btn btn-b">B</button>
    </div>
    <div id="menu-buttons">
      <button id="btn-play" class="menu-btn">▶❚❚</button>
    </div>
  </div>
</div>
<script src="js/game.js"></script>
</body>
</html>
