<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fireboy The Brothers - The Legend of Terra Nemesis</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#gameContainer{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#000}
#touchControls{position:fixed;bottom:0;left:0;right:0;height:200px;pointer-events:none;z-index:100;display:none}
.touch-btn{position:absolute;pointer-events:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Arial Black',sans-serif;font-weight:bold;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.5);border:3px solid rgba(255,255,255,.3);-webkit-tap-highlight-color:transparent}
.touch-btn:active,.touch-btn.active{transform:scale(.9);border-color:rgba(255,255,255,.7)}
#dpad{position:absolute;left:20px;bottom:20px;width:150px;height:150px;pointer-events:auto}
.dpad-btn{position:absolute;width:48px;height:48px;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.3);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;color:rgba(255,255,255,.7);pointer-events:auto;-webkit-tap-highlight-color:transparent}
.dpad-btn:active,.dpad-btn.active{background:rgba(255,255,255,.35);color:#fff}
#dpad-up{left:51px;top:0}
#dpad-down{left:51px;bottom:0}
#dpad-left{left:0;top:51px}
#dpad-right{right:0;top:51px}
#actionBtn{right:30px;bottom:30px;width:74px;height:74px;background:rgba(255,60,60,.3);border-color:rgba(255,60,60,.5);font-size:14px}
#jumpBtn{right:115px;bottom:50px;width:64px;height:64px;background:rgba(60,160,255,.3);border-color:rgba(60,160,255,.5);font-size:12px}
#pauseBtn{right:20px;top:20px;width:48px;height:48px;background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);font-size:20px}
#pauseBtn.pause-state{background:rgba(60,255,60,.25);border-color:rgba(60,255,60,.5)}
</style>
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
<div id="gameContainer"><canvas id="gameCanvas"></canvas></div>
<div id="touchControls">
  <div id="dpad">
    <div class="dpad-btn" id="dpad-up">▲</div>
    <div class="dpad-btn" id="dpad-down">▼</div>
    <div class="dpad-btn" id="dpad-left">◀</div>
    <div class="dpad-btn" id="dpad-right">▶</div>
  </div>
  <div class="touch-btn" id="jumpBtn">JUMP</div>
  <div class="touch-btn" id="actionBtn">FIRE</div>
  <div class="touch-btn" id="pauseBtn">⏸</div>
</div>
<script>
// ============================================================
// FIREBOY THE BROTHERS - THE LEGEND OF TERRA NEMESIS
// Complete HTML5 Video Game
// ============================================================
const C=document.getElementById('gameCanvas'),X=C.getContext('2d');
const GW=800,GH=480,GRAV=0.55,MAXFALL=12,TILE=32;

// --- STATE ---
let GS='loading',prevPause=null;
let titleT=0,clearT=0,overT=0,bossIntroT=0,completeT=0;

// --- INPUT ---
const K={};
const TI={u:false,d:false,l:false,r:false,j:false,f:false};
document.addEventListener('keydown',e=>{K[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();initACtx()});
document.addEventListener('keyup',e=>{K[e.code]=false});

function setupTouch(){
  const td='ontouchstart'in window||navigator.maxTouchPoints>0;
  if(td)document.getElementById('touchControls').style.display='block';
  function bt(id,k){
    const el=document.getElementById(id);
    el.addEventListener('touchstart',e=>{e.preventDefault();TI[k]=true;el.classList.add('active');initACtx()});
    el.addEventListener('touchend',e=>{e.preventDefault();TI[k]=false;el.classList.remove('active')});
    el.addEventListener('touchcancel',e=>{TI[k]=false;el.classList.remove('active')});
  }
  bt('dpad-up','u');bt('dpad-down','d');bt('dpad-left','l');bt('dpad-right','r');
  bt('jumpBtn','j');bt('actionBtn','f');
  document.getElementById('pauseBtn').addEventListener('touchstart',e=>{e.preventDefault();initACtx();togglePause()});
}

function togglePause(){
  if(GS==='paused'){GS=prevPause||'stage';document.getElementById('pauseBtn').textContent='⏸';document.getElementById('pauseBtn').classList.remove('pause-state')}
  else if(GS==='stage'||GS==='boss'){prevPause=GS;GS='paused';document.getElementById('pauseBtn').textContent='▶';document.getElementById('pauseBtn').classList.add('pause-state')}
}

const iL=()=>K.ArrowLeft||K.KeyA||TI.l;
const iR=()=>K.ArrowRight||K.KeyD||TI.r;
const iU=()=>K.ArrowUp||K.KeyW||TI.u;
const iDn=()=>K.ArrowDown||K.KeyS||TI.d;
const iJ=()=>K.Space||K.ArrowUp||K.KeyW||TI.j;
const iF=()=>K.KeyZ||K.KeyX||K.KeyJ||K.KeyK||TI.f;
const iS=()=>K.Enter||K.Space;

// --- AUDIO ---
let actx=null;
function initACtx(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)()}
function pNote(f,dur,tp,vol){
  initACtx();const o=actx.createOscillator(),g=actx.createGain();
  o.type=tp||'square';o.frequency.value=f;g.gain.value=vol||.08;
  g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);
  o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+dur);
}
let sfxVol=0.3;
function pSFX(n){if(A[n]&&A[n].play){const a=A[n].cloneNode();a.volume=sfxVol;a.play().catch(()=>{})}}
let musN=null;
function pMus(n,lp){sMus();if(A[n]&&A[n].play){A[n].loop=!!lp;A[n].volume=.2;A[n].play().catch(()=>{});musN=n}}
function sMus(){if(musN&&A[musN]){A[musN].pause();A[musN].currentTime=0;musN=null}}

// Stage music (procedural chiptune)
let smInt=null,smIdx=0;
const smMel=[262,294,330,349,392,349,330,294,262,330,392,440,523,440,392,330,294,330,349,392,440,523,440,392,349,330,294,262,220,262,294,330];
function startSM(){initACtx();stopSM();smIdx=0;smInt=setInterval(()=>{if(GS!=='stage'&&GS!=='boss'&&GS!=='bossintro')return;const f=smMel[smIdx%smMel.length];pNote(f,.18,'square',.035);pNote(f/2,.2,'triangle',.025);smIdx++},220)}
function stopSM(){if(smInt){clearInterval(smInt);smInt=null}}

// --- ASSETS ---
const AL=[
  {n:'fireboy',s:'Fireboy (Playable Characters).png',t:'i'},
  {n:'caroline',s:'Caroline (Playable Characters).png',t:'i'},
  {n:'butch',s:'Butch (Playable Characters).png',t:'i'},
  {n:'anabel',s:'Anabel (Playable Characters).png',t:'i'},
  {n:'bigcore',s:'Big Core MK.I (Boss).png',t:'i'},
  {n:'firebreath',s:'Fire Breath (Boss).png',t:'i'},
  {n:'bclaser',s:'BigCore_Laser.png',t:'i'},
  {n:'fbbomb',s:'FireBreath_Bomb.png',t:'i'},
  {n:'bgspace',s:'Background (Space).png',t:'i'},
  {n:'platform',s:'Foreground (Platform).png',t:'i'},
  {n:'boss_music',s:'13 Last Evil [Boss Battle].mp3',t:'a'},
  {n:'gameover_mus',s:'21. Game Over.mp3',t:'a'},
  {n:'stageclear_mus',s:'23. Stage Clear.mp3',t:'a'},
  {n:'bosswarn',s:'BossWarning.wav',t:'a'},
  {n:'bossdefeat',s:'BossDefeat_Explosion.wav',t:'a'},
  {n:'bclaser_sfx',s:'BigCore_Laser.wav',t:'a'},
  {n:'hitboss',s:'HitBoss.wav',t:'a'},
  {n:'impact',s:'Impact2.wav',t:'a'},
  {n:'jump_sfx',s:'Jump.wav',t:'a'},
  {n:'pdeath',s:'PlayerDeath.wav',t:'a'},
  {n:'phurt',s:'PlayerHurt.wav',t:'a'},
  {n:'fireshoot',s:'Player_FireShoot.wav',t:'a'},
  {n:'strain',s:'Strain.wav',t:'a'},
  {n:'strain2',s:'Strain2.wav',t:'a'},
];
const A={};
let aLoad=0;
function loadA(){for(const a of AL){if(a.t==='i'){const img=new Image();img.onload=img.onerror=()=>{aLoad++;chkA()};img.src=a.s;A[a.n]=img}else{const aud=new Audio();aud.oncanplaythrough=aud.onerror=()=>{aLoad++;chkA()};aud.src=a.s;aud.preload='auto';A[a.n]=aud}}}
function chkA(){if(aLoad>=AL.length){GS='title';titleT=0}}

// --- CHARACTERS ---
const CHARS=[
  {name:'FIREBOY',key:'fireboy',as:'fireboy',hp:5,spd:4,jp:-11,fr:8,ps:7,pt:'fire',col:'#FF4400',desc:'A brave flame warrior who shoots fireballs. Balanced stats with strong attack power.',w:32,h:44},
  {name:'CAROLINE',key:'caroline',as:'caroline',hp:4,spd:5,jp:-12,fr:6,ps:9,pt:'energy',col:'#FF3366',desc:'Quick and agile with rapid energy shots. Fastest runner with quick attacks.',w:28,h:42},
  {name:'BUTCH',key:'butch',as:'butch',hp:7,spd:3,jp:-10,fr:12,ps:6,pt:'fist',col:'#44CC44',desc:'Tough powerhouse with devastating melee. Highest HP but slow movement.',w:34,h:38},
  {name:'ANABEL',key:'anabel',as:'anabel',hp:3,spd:5,jp:-13,fr:5,ps:10,pt:'star',col:'#FF88CC',desc:'Swift and graceful with star projectiles. Best jumper with fastest shots.',w:26,h:40}
];
let selChar=0,charCur=0,charHold=false,startHold=false;

// --- STAGES ---
const STAGES=[
  {name:'TERRA STATION',gY:GH-64,len:6400,en:'basic',boss:'bigcore',gim:'conveyor',pCol:'#556677',scroll:.5},
  {name:'INFERNO CAVERN',gY:GH-64,len:6400,en:'fire',boss:'firebreath',gim:'lava',pCol:'#884422',scroll:.6},
  {name:'NEMESIS FORTRESS',gY:GH-64,len:8000,en:'elite',boss:'both',gim:'spikes',pCol:'#443366',scroll:.7}
];
let curStg=0,stgScr=0;

// --- ETYPES ---
const ETYPES={
  basic:[{n:'drone',w:24,h:24,hp:2,sp:1.5,sr:90,col:'#8888AA',beh:'hover'},{n:'walker',w:28,h:28,hp:3,sp:1,sr:60,col:'#AA8866',beh:'walk'}],
  fire:[{n:'fireball',w:22,h:22,hp:2,sp:2,sr:80,col:'#FF6622',beh:'hover'},{n:'lavagolem',w:32,h:36,hp:5,sp:.8,sr:50,col:'#CC4400',beh:'walk'}],
  elite:[{n:'mech',w:30,h:30,hp:4,sp:1.8,sr:40,col:'#6666CC',beh:'hover'},{n:'tank',w:36,h:32,hp:8,sp:.6,sr:70,col:'#886688',beh:'walk'}]
};

// --- GAME OBJECTS ---
let P=null,enemies=[],projs=[],parts=[],plats=[],gimms=[],boss=null;
let cam={x:0,y:0},shake={x:0,y:0,i:0,t:0};

// Stars bg
const stars=[];for(let i=0;i<120;i++)stars.push({x:Math.random()*GW,y:Math.random()*GH*.7,sz:.5+Math.random()*2,br:.3+Math.random()*.7,tw:Math.random()*Math.PI*2});

function mkP(ci){
  const c=CHARS[ci];
  return{x:100,y:c.h>40?STAGES[0].gY-c.h-10:STAGES[0].gY-54,vx:0,vy:0,w:c.w,h:c.h,ci:ci,hp:c.hp,mhp:c.hp,lives:3,score:0,gr:false,face:1,st:0,inv:0,dead:false,af:0,at:0,conv:0};
}

function mkBoss(bt,bx,by){
  if(bt==='bigcore'||bt==='both')return{type:'bigcore',x:bx,y:by,vx:0,vy:0,w:128,h:96,hp:60,mhp:60,ph:1,timer:0,at:0,pat:0,alive:true,ft:0,projs:[],mt:0,tY:by};
  if(bt==='firebreath')return{type:'firebreath',x:bx,y:by,vx:0,vy:0,w:96,h:112,hp:50,mhp:50,ph:1,timer:0,at:0,pat:0,alive:true,ft:0,projs:[],mt:0,bt:0};
  return null;
}

function genStg(si){
  const s=STAGES[si];plats=[];gimms=[];
  plats.push({x:0,y:s.gY,w:s.len,h:64,tp:'ground'});
  const np=Math.floor(s.len/300);
  for(let i=0;i<np;i++){
    const px=200+i*300+Math.random()*100,py=s.gY-80-Math.random()*160,pw=64+Math.random()*96;
    plats.push({x:px,y:py,w:pw,h:16,tp:'platform'});
  }
  // Gimmicks
  if(s.gim==='conveyor'){for(let i=0;i<8;i++)gimms.push({x:600+i*700,y:s.gY-16,w:128,h:16,tp:'conveyor',dir:i%2===0?1:-1,sp:1.5})}
  else if(s.gim==='lava'){
    for(let i=0;i<6;i++)gimms.push({x:500+i*900,y:s.gY-8,w:96,h:8,tp:'lava',t:0});
    for(let i=0;i<3;i++)gimms.push({x:2000+i*1800,y:s.gY+20,w:200,h:200,tp:'risenlava',t:0,mt:180,rise:false});
  }else if(s.gim==='spikes'){
    for(let i=0;i<10;i++)gimms.push({x:400+i*600,y:s.gY-12,w:48,h:12,tp:'spikes'});
    for(let i=0;i<5;i++)plats.push({x:800+i*1200,y:s.gY-120,w:80,h:16,tp:'moving',ox:800+i*1200,mr:150,ms:1,mt:Math.random()*Math.PI*2});
  }
  enemies=[];
  const et=ETYPES[s.en]||ETYPES.basic;
  const ne=Math.floor(s.len/400);
  for(let i=0;i<ne;i++){
    const ex=400+i*400+Math.random()*200,ey=s.gY-40-Math.random()*100;
    const e=et[Math.floor(Math.random()*et.length)];
    enemies.push({x:ex,y:ey,vx:e.sp*(Math.random()<.5?1:-1),vy:0,w:e.w,h:e.h,hp:e.hp,mhp:e.hp,sp:e.sp,sr:e.sr,st:Math.floor(Math.random()*e.sr),col:e.col,beh:e.beh,n:e.n,alive:true,at:0});
  }
}

function spawnProj(x,y,dir,ci){
  const c=CHARS[ci];
  projs.push({x,y,vx:c.ps*dir,vy:0,w:c.pt==='fist'?14:10,h:c.pt==='fist'?14:10,tp:c.pt,col:c.col,fp:true,dmg:c.pt==='fist'?2:1,life:120});
  pSFX('fireshoot');
}

function spawnParts(x,y,col,cnt,sp){
  for(let i=0;i<cnt;i++)parts.push({x,y,vx:(Math.random()-.5)*sp,vy:(Math.random()-.5)*sp-2,life:30+Math.random()*30,ml:60,col,sz:2+Math.random()*4});
}

function trigSh(i,d){shake.i=i;shake.t=d}

function rC(x1,y1,w1,h1,x2,y2,w2,h2){return x1<x2+w2&&x1+w1>x2&&y1<y2+h2&&y1+h1>y2}

// --- UPDATE ---
function updTitle(){titleT++;if(iS()&&titleT>30){GS='charselect';charCur=0;titleT=0;pNote(880,.1,'square',.05)}}
function updCharSel(){
  if(K.ArrowLeft||TI.l){if(!charHold){charCur=(charCur-1+4)%4;pNote(440,.08,'square',.04)}charHold=true}
  else if(K.ArrowRight||TI.r){if(!charHold){charCur=(charCur+1)%4;pNote(440,.08,'square',.04)}charHold=true}
  else charHold=false;
  if(iS()&&!startHold){selChar=charCur;P=mkP(selChar);curStg=0;startStg();startHold=true;pNote(660,.15,'square',.06)}
  if(!iS())startHold=false;
}

function startStg(){
  const s=STAGES[curStg];genStg(curStg);
  P.x=100;P.y=s.gY-P.h-10;P.vx=0;P.vy=0;P.dead=false;P.inv=60;P.gr=false;
  stgScr=0;cam.x=0;cam.y=0;boss=null;projs=[];parts=[];
  GS='stage';startSM();
}

function updStg(){
  if(!P||P.dead)return;const s=STAGES[curStg];
  stgScr+=s.scroll;if(stgScr>s.len-GW)stgScr=s.len-GW;cam.x=stgScr;
  const tpx=stgScr+GW*.3;if(P.x<tpx)P.x=tpx;if(P.x>stgScr+GW-40)P.x=stgScr+GW-40;
  if(stgScr>=s.len-GW-200&&!boss){enemies=[];bossIntroT=180;GS='bossintro';boss=mkBoss(s.boss,stgScr+GW+50,120);stopSM();pSFX('bosswarn');return}
  updP();updE();updGim();updProj();updParts();updShk();
}

function updBossIntro(){
  bossIntroT--;
  if(boss){if(boss.x>cam.x+GW-boss.w-40)boss.x-=1.5;if(boss.y<140)boss.y+=.5}
  if(bossIntroT<=0){GS='boss';pMus('boss_music',true)}
}

function updBoss(){
  if(!boss||!boss.alive)return;
  updP();boss.timer++;boss.at++;if(boss.ft>0)boss.ft--;
  if(boss.type==='bigcore')updBC();else updFB();
  // Boss projs vs player
  if(boss.projs)for(let i=boss.projs.length-1;i>=0;i--){
    const bp=boss.projs[i];bp.x+=bp.vx;bp.y+=bp.vy;bp.life--;
    if(bp.life<=0){boss.projs.splice(i,1);continue}
    if(P&&!P.dead&&P.inv<=0&&rC(P.x,P.y,P.w,P.h,bp.x,bp.y,bp.w,bp.h)){hurtP(bp.dmg||1);boss.projs.splice(i,1)}
  }
  // Player projs vs boss
  for(let i=projs.length-1;i>=0;i--){
    const p=projs[i];
    if(p.fp&&rC(p.x,p.y,p.w,p.h,boss.x,boss.y,boss.w,boss.h)){
      boss.hp-=p.dmg;boss.ft=6;projs.splice(i,1);pSFX('hitboss');
      spawnParts(p.x,p.y,'#FFFF00',5,4);trigSh(3,8);
      if(boss.hp<=boss.mhp*.5&&boss.ph===1){boss.ph=2;trigSh(8,20);spawnParts(boss.x+boss.w/2,boss.y+boss.h/2,'#FF4400',20,8)}
      if(boss.hp<=0){boss.alive=false;trigSh(15,60);spawnParts(boss.x+boss.w/2,boss.y+boss.h/2,'#FF8800',40,12);spawnParts(boss.x+boss.w/2,boss.y+boss.h/2,'#FFFF00',30,10);pSFX('bossdefeat');sMus();clearT=180;GS='stageclear';pMus('stageclear_mus',false)}
    }
  }
  updProj();updParts();updShk();
}

function updBC(){
  boss.mt++;boss.tY=100+Math.sin(boss.mt*.015)*100;
  boss.y+=(boss.tY-boss.y)*.03;
  boss.x=cam.x+GW-boss.w-30+Math.sin(boss.mt*.01)*20;
  const rate=boss.ph===2?40:70;
  if(boss.at>=rate){boss.at=0;boss.pat=(boss.pat+1)%3;
    if(boss.pat===0){for(let a=-20;a<=20;a+=10)boss.projs.push({x:boss.x,y:boss.y+boss.h/2,vx:-5,vy:a*.15,w:28,h:6,life:120,dmg:1,col:'#4488FF'});pSFX('bclaser_sfx')}
    else if(boss.pat===1){if(P){const dx=P.x-boss.x,dy=P.y-boss.y,d=Math.sqrt(dx*dx+dy*dy)||1;boss.projs.push({x:boss.x,y:boss.y+boss.h/2,vx:dx/d*5,vy:dy/d*5,w:20,h:6,life:150,dmg:1,col:'#66AAFF'})}pSFX('bclaser_sfx')}
    else{if(boss.ph===2){for(let a=0;a<360;a+=45){const r=a*Math.PI/180;boss.projs.push({x:boss.x+boss.w/2,y:boss.y+boss.h/2,vx:Math.cos(r)*3,vy:Math.sin(r)*3,w:10,h:10,life:100,dmg:1,col:'#FF4488'})}}else{boss.projs.push({x:boss.x,y:boss.y+20,vx:-6,vy:0,w:24,h:6,life:120,dmg:1,col:'#4488FF'});boss.projs.push({x:boss.x,y:boss.y+boss.h-20,vx:-6,vy:0,w:24,h:6,life:120,dmg:1,col:'#4488FF'})}pSFX('bclaser_sfx')}
  }
}

function updFB(){
  boss.mt++;boss.y=80+Math.sin(boss.mt*.02)*80;
  boss.x=cam.x+GW-boss.w-40+Math.sin(boss.mt*.008)*30;
  const rate=boss.ph===2?30:55;
  if(boss.at>=rate){boss.at=0;boss.pat=(boss.pat+1)%3;
    if(boss.pat===0){for(let i=0;i<5;i++)boss.projs.push({x:boss.x+10,y:boss.y+boss.h/2+(i-2)*20,vx:-3-Math.random()*2,vy:(i-2)*.8,w:12,h:12,life:100,dmg:1,col:'#FF6600'});pSFX('strain')}
    else if(boss.pat===1){for(let i=0;i<3;i++)boss.projs.push({x:boss.x+Math.random()*boss.w,y:boss.y+boss.h,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,w:10,h:10,life:120,dmg:1,col:'#FF4400'});pSFX('strain2')}

    else if(g.tp==='risenlava'){if(g.rise){g.y-=.5;g.t--;if(g.t<=0)g.rise=false}else{g.t++;if(g.t>=g.mt)g.rise=true}if(g.y<STAGES[curStg].gY&&rC(P.x,P.y,P.w,P.h,g.x,g.y,g.w,STAGES[curStg].gY-g.y))hurtP(1)}

  X.fillStyle='rgba(0,0,0,.5)';X.fillRect(8,8,200,22);X.strokeStyle=c.col;X.lineWidth=2;X.strokeRect(8,8,200,22);
  const hp=P.hp/P.mhp,hc=hp>.5?'#44FF44':hp>.25?'#FFAA00':'#FF2222';
  X.fillStyle=hc;X.fillRect(10,10,196*hp,18);
  X.fillStyle='#FFF';X.font='bold 12px Arial,sans-serif';X.textAlign='left';X.fillText(`HP: ${P.hp}/${P.mhp}`,14,24);
  X.fillStyle=c.col;X.font='bold 14px Arial,sans-serif';X.fillText(`♥ × ${P.lives}`,220,24);
  X.fillStyle='#FFCC00';X.font='bold 14px Arial,sans-serif';X.textAlign='right';X.fillText(`SCORE: ${P.score}`,GW-12,24);
  X.fillStyle='#889';X.font='12px Arial,sans-serif';X.textAlign='right';X.fillText(STAGES[curStg].name,GW-12,42);
  // Boss HP
  if(boss&&boss.alive&&(GS==='boss'||GS==='bossintro')){
    const bw=300,bh=16,bx=(GW-bw)/2,by=GH-30;
    X.fillStyle='rgba(0,0,0,.6)';X.fillRect(bx-2,by-2,bw+4,bh+4);X.strokeStyle='#FF4444';X.lineWidth=2;X.strokeRect(bx-2,by-2,bw+4,bh+4);
    const bhp=boss.hp/boss.mhp;X.fillStyle=bhp>.5?'#FF4444':bhp>.25?'#FF8800':'#FFFF00';X.fillRect(bx,by,bw*bhp,bh);
    X.fillStyle='#FFF';X.font='bold 10px Arial,sans-serif';X.textAlign='center';
    const bn=boss.type==='bigcore'?'DUO MECHA ROCKET - BIG CORE MK.I':'FIRE BREATH';
    X.fillText(bn,GW/2,by+12);
  }
}

function drawBossIntro(){
  drawStage();
  const fl=Math.floor(bossIntroT/10)%2===0;
  if(fl){X.fillStyle='rgba(255,0,0,.15)';X.fillRect(0,0,GW,GH)}
  X.fillStyle=fl?'#FF0000':'#FF4400';X.font='bold 48px "Arial Black",sans-serif';X.textAlign='center';
  X.shadowColor='#FF0000';X.shadowBlur=20;X.fillText('⚠ WARNING ⚠',GW/2,GH/2-30);X.shadowBlur=0;
  X.fillStyle='#FFCC00';X.font='bold 20px "Arial Black",sans-serif';
  const bn=boss&&boss.type==='bigcore'?'DUO MECHA ROCKET - BIG CORE MK.I':'FIRE BREATH';
  X.fillText(bn,GW/2,GH/2+10);
  X.fillStyle='#FFF';X.font='14px Arial,sans-serif';X.fillText('DESTROY THE ENEMY!',GW/2,GH/2+40);
}

function drawClear(){
  drawStage();X.fillStyle='rgba(0,0,0,.4)';X.fillRect(0,0,GW,GH);
  X.shadowColor='#FF8800';X.shadowBlur=20;X.fillStyle='#FFCC00';X.font='bold 36px "Arial Black",sans-serif';X.textAlign='center';X.fillText('STAGE CLEAR!',GW/2,GH/2);X.shadowBlur=0;
  if(curStg<STAGES.length-1){X.fillStyle='#FFF';X.font='16px Arial,sans-serif';X.fillText(`Next: ${STAGES[curStg+1].name}`,GW/2,GH/2+50)}
  else{X.fillStyle='#44FF44';X.font='20px "Arial Black",sans-serif';X.fillText('ALL STAGES COMPLETE!',GW/2,GH/2+50)}
}

function drawOver(){
  drawBG();X.fillStyle='rgba(0,0,0,.5)';X.fillRect(0,0,GW,GH);
  X.shadowColor='#FF0000';X.shadowBlur=30;X.fillStyle='#FF2200';X.font='bold 52px "Arial Black",sans-serif';X.textAlign='center';X.fillText('GAME OVER',GW/2,GH/2-30);X.shadowBlur=0;
  if(P){X.fillStyle='#FFCC00';X.font='20px Arial,sans-serif';X.fillText(`Final Score: ${P.score}`,GW/2,GH/2+20)}
  if(overT>180){X.fillStyle='#FFF';X.font='16px Arial,sans-serif';X.fillText('PRESS START TO CONTINUE',GW/2,GH/2+60)}
}

function drawPaused(){
  drawStage();X.fillStyle='rgba(0,0,0,.6)';X.fillRect(0,0,GW,GH);
  X.fillStyle='#FFF';X.font='bold 40px "Arial Black",sans-serif';X.textAlign='center';X.fillText('PAUSED',GW/2,GH/2-20);
  X.fillStyle='#AAA';X.font='16px Arial,sans-serif';X.fillText('PRESS START TO RESUME',GW/2,GH/2+30);
}

function drawComplete(){
  drawBG();const t=completeT*.03;
  X.shadowColor='#FFCC00';X.shadowBlur=30+Math.sin(t)*10;X.fillStyle='#FFDD00';X.font='bold 42px "Arial Black",sans-serif';X.textAlign='center';X.fillText('VICTORY!',GW/2,100);X.shadowBlur=0;
  X.fillStyle='#FFF';X.font='20px Arial,sans-serif';X.fillText('THE LEGEND OF TERRA NEMESIS',GW/2,150);X.fillText('HAS BEEN DEFEATED!',GW/2,180);
  const ca2=['fireboy','caroline','butch','anabel'];
  const cc2=['#FF4400','#FF3366','#44CC44','#FF88CC'];
  for(let i=0;i<4;i++){const cx=GW/5*(i+1)-30,cy=220;if(A[ca2[i]]&&A[ca2[i]].complete&&A[ca2[i]].naturalWidth>10)X.drawImage(A[ca2[i]],cx,cy,60,80);else{X.fillStyle=cc2[i];X.fillRect(cx,cy,40,60)}}
  if(P){X.fillStyle='#FFCC00';X.font='bold 24px Arial,sans-serif';X.fillText(`Final Score: ${P.score}`,GW/2,360)}
  X.fillStyle='#889';X.font='14px Arial,sans-serif';X.fillText('CONGRATULATIONS!',GW/2,400);
  if(Math.floor(completeT/30)%2===0){X.fillStyle='#FFF';X.font='16px Arial,sans-serif';X.fillText('PRESS START TO PLAY AGAIN',GW/2,440)}
  completeT++;if(iS()&&completeT>60){GS='title';titleT=0}
}

// --- UTILS ---
function rrect(x,y,w,h,r,f,s){X.beginPath();X.moveTo(x+r,y);X.lineTo(x+w-r,y);X.quadraticCurveTo(x+w,y,x+w,y+r);X.lineTo(x+w,y+h-r);X.quadraticCurveTo(x+w,y+h,x+w-r,y+h);X.lineTo(x+r,y+h);X.quadraticCurveTo(x,y+h,x,y+h-r);X.lineTo(x,y+r);X.quadraticCurveTo(x,y,x+r,y);X.closePath();if(f)X.fill();if(s)X.stroke()}

function dStar(cx,cy,sp,oR,iR,col){let rot=Math.PI/2*3,step=Math.PI/sp;X.beginPath();X.moveTo(cx,cy-oR);for(let i=0;i<sp;i++){X.lineTo(cx+Math.cos(rot)*oR,cy+Math.sin(rot)*oR);rot+=step;X.lineTo(cx+Math.cos(rot)*iR,cy+Math.sin(rot)*iR);rot+=step}X.closePath();X.fillStyle=col;X.fill()}

function wTxt(txt,x,y,mw,lh){const w=txt.split(' ');let l='';for(let i=0;i<w.length;i++){const tl=l+w[i]+' ';if(X.measureText(tl).width>mw&&i>0){X.fillText(l,x,y);l=w[i]+' ';y+=lh}else l=tl}X.fillText(l,x,y)}

// --- RESIZE ---
function resize(){
  const r=GW/GH;let w=window.innerWidth,h=window.innerHeight;
  if(w/h>r)w=h*r;else h=w/r;
  C.width=GW;C.height=GH;C.style.width=w+'px';C.style.height=h+'px';
}
window.addEventListener('resize',resize);resize();

// --- PAUSE KEY ---
document.addEventListener('keydown',e=>{if(e.code==='Escape'||e.code==='KeyP'){if(GS==='paused'||GS==='stage'||GS==='boss')togglePause()}});

// --- MAIN LOOP ---
function update(){
  switch(GS){
    case'title':updTitle();break;case'charselect':updCharSel();break;
    case'stage':updStg();break;case'bossintro':updBossIntro();break;
    case'boss':updBoss();break;case'stageclear':updClear();break;
    case'gameover':updOver();break;
  }
}

function draw(){
  X.clearRect(0,0,GW,GH);
  switch(GS){
    case'loading':X.fillStyle='#000011';X.fillRect(0,0,GW,GH);X.fillStyle='#FFF';X.font='20px Arial,sans-serif';X.textAlign='center';X.fillText('Loading...',GW/2,GH/2-10);const pr=aLoad/AL.length;X.fillStyle='#333';X.fillRect(GW/2-150,GH/2+20,300,20);X.fillStyle='#FF6600';X.fillRect(GW/2-150,GH/2+20,300*pr,20);X.fillStyle='#FFF';X.font='12px Arial';X.fillText(`${Math.floor(pr*100)}%`,GW/2,GH/2+35);break;
    case'title':drawTitle();break;case'charselect':drawCS();break;
    case'stage':case'boss':drawStage();break;case'bossintro':drawBossIntro();break;
    case'stageclear':drawClear();break;case'gameover':drawOver();break;
    case'paused':drawPaused();break;case'gamecomplete':drawComplete();break;
  }
}

function loop(){update();draw();requestAnimationFrame(loop)}

// --- INIT ---
setupTouch();loadA();loop();
</script>
